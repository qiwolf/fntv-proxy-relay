<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Relay · 配置工作台原型</title>
<style>
:root{--bg:hsl(210,16%,96%);--paper:hsl(0,0%,100%);--ink:hsl(215,20%,18%);--muted:hsl(215,10%,40%);--line:hsl(210,14%,85%);--control:hsl(215,10%,50%);--soft:hsl(210,16%,92%);--radius:4px;--s1:8px;--s2:16px;--s3:24px;--s4:32px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 Arial,"PingFang SC",sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:4px}button{cursor:pointer;border:1px solid var(--control);border-radius:var(--radius);background:var(--paper);color:var(--ink);padding:8px 16px;min-height:40px}button:hover{background:var(--soft)}button.primary{background:var(--ink);color:white;border-color:var(--ink)}button:disabled{cursor:not-allowed;opacity:.4}input,select,textarea{width:100%;padding:8px 12px;background:var(--paper);color:var(--ink);border:1px solid var(--control);border-radius:var(--radius)}textarea{min-height:192px;font:14px/1.6 monospace}label{display:block;font-weight:600;margin-bottom:8px}label small{display:block;font-weight:400;color:var(--muted)}h1{font-size:30px;line-height:1.25;margin:8px 0 12px}h2{font-size:20px;margin:0 0 16px}h3{font-size:16px;margin:0 0 8px}p{margin:0 0 16px;max-width:768px}small,.muted{color:var(--muted)}.shell{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}.sidebar{background:var(--paper);border-right:1px solid var(--line);padding:32px 24px;display:flex;flex-direction:column;gap:32px}.brand{font-size:24px;font-weight:600;letter-spacing:1px}.brand span{font-size:12px;margin-left:8px;font-weight:400}.nav{display:grid;gap:8px}.nav button{text-align:left;border:0;background:transparent;padding:12px 16px}.nav button.active{background:var(--soft);font-weight:600}.nav .num{display:inline-block;width:32px;color:var(--muted)}.sidefoot{margin-top:auto;font-size:12px}.content{min-width:0}.topbar{padding:16px 32px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;align-items:center}.pill{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:4px 8px;font-size:12px;background:var(--paper)}main{max-width:1280px;margin:auto;padding:32px}.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:32px}.eyebrow{font-size:12px;font-weight:600;letter-spacing:1px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-bottom:24px}.grid .card{margin:0}.metric{font-size:24px;font-weight:600;margin:12px 0}.banner{background:var(--soft);padding:16px 24px;border-left:4px solid var(--control);margin-bottom:24px}.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.field{margin-bottom:24px}.flow{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:24px 0}.node{padding:16px;border:1px solid var(--line);background:var(--bg);flex:1;min-width:128px}.node small{display:block}.steps{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}.steps span{padding:8px 12px;border-bottom:4px solid var(--line)}.steps .on{border-color:var(--ink);font-weight:600}.choice{display:block;width:100%;text-align:left;padding:24px;margin-bottom:16px}.choice[aria-pressed=true]{border:2px solid var(--ink);background:var(--soft)}.choice small{display:block;margin-top:8px}.tabs{display:flex;gap:8px;margin-bottom:24px}.tabs button.selected{background:var(--ink);color:white}.check{display:flex;gap:12px;align-items:center}.check input{width:16px;height:16px}.footbar{display:flex;justify-content:space-between;gap:16px;margin-top:24px;padding-top:24px;border-top:1px solid var(--line)}pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);padding:16px;border-radius:4px;font-size:12px}dialog{border:1px solid var(--line);border-radius:4px;width:640px;max-width:calc(100% - 32px);max-height:90vh;padding:32px;box-shadow:0 15px 35px hsla(0,0%,0%,.2)}dialog::backdrop{background:hsla(0,0%,0%,.4)}#toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:white;padding:16px 24px;max-width:384px;border-radius:4px;z-index:10}#toast:empty{display:none}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left}th,td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}th{font-weight:600;background:var(--bg)}.error{border-left:4px solid var(--ink);padding:12px;background:var(--soft)}@media(max-width:768px){.shell{display:block}.sidebar{padding:16px;border-right:0;border-bottom:1px solid var(--line);gap:16px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.sidefoot{display:none}.topbar{padding:16px;flex-wrap:wrap}main{padding:24px 16px}.grid,.two{grid-template-columns:1fr}.heading{display:block}h1{font-size:24px}.heading .actions{margin-top:16px}.flow{gap:8px}.node{min-width:100%}.flow>b{transform:rotate(90deg)}.card{padding:16px}.tabs{flex-wrap:wrap}}
@media(min-width:769px) and (max-width:1024px){.shell{grid-template-columns:192px minmax(0,1fr)}.sidebar{padding:24px 16px}.grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}.heading{display:block}.heading>button{margin-top:16px}.flow{display:grid;grid-template-columns:1fr}.flow>b{transform:rotate(90deg);text-align:center}}
.mode-window{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}.mode-tablist{display:flex;overflow-x:auto;background:var(--bg);border-bottom:1px solid var(--line);padding:0 16px}.mode-tablist button{flex:1;white-space:nowrap;border:0;border-bottom:4px solid transparent;border-radius:0;background:transparent;padding:16px;min-width:128px}.mode-tablist button[aria-selected=true]{border-bottom-color:var(--ink);background:var(--paper);font-weight:600}.mode-panel{padding:32px}.mode-panel summary{cursor:pointer}.mode-panel .footbar{align-items:center;flex-wrap:wrap}@media(max-width:768px){.mode-panel{padding:16px}.mode-tablist{padding:0}.mode-tablist button{padding:12px;min-width:112px}.mode-panel .footbar{flex-direction:column;align-items:stretch}}
</style></head><body>
<div class="shell"><aside class="sidebar"><div><div class="brand">Relay<span>配置工作台</span></div><small>飞牛 · Emby · Jellyfin</small></div><nav class="nav" aria-label="主导航" id="nav"></nav><div class="sidefoot">交互原型 / 功能评审版<br>仅示例数据 · 不连接生产<br>刷新页面会重置所有演示状态</div></aside><div class="content"><header class="topbar"><div><span class="pill">原型演示</span> <span id="roleLabel">主代理 · NAS</span></div><div class="actions"><span id="draftLabel" class="muted">没有待应用修改</span><button id="reviewTop" onclick="review()">查看变更</button></div></header><main id="main"></main></div></div><dialog id="dialog"></dialog><div id="toast" role="status" aria-live="polite"></div>
<script>
const pages=['概览','部署向导','媒体服务','播放与直出','安全与证书','诊断与日志','配置管理'];
const types={fntv:'飞牛影视',emby:'Emby',jellyfin:'Jellyfin'};
const initial={role:'proxy',media:'https://media.example.com:49967',root:'/mnt/strm',upstream:'media-source.internal:5244',cert:'/app/certs/fullchain.pem',key:'/app/certs/privkey.pem',services:{fntv:{enabled:true,target:'http://192.0.2.10:8005',host:'fntv.example.com',port:'28015'},emby:{enabled:true,target:'http://192.0.2.10:8097',host:'emby.example.com',port:'18197'},jellyfin:{enabled:true,target:'http://192.0.2.10:8096',host:'jellyfin.example.com',port:'18196'}}};
let active=0,tab='fntv',step=0,draft=structuredClone(initial),applied=structuredClone(initial),backup=null,checks=false,importText='';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dirty=()=>JSON.stringify(draft)!==JSON.stringify(applied);
function notice(t){document.getElementById('toast').textContent=t;setTimeout(()=>document.getElementById('toast').textContent='',4500)}
function header(title,sub,action=''){return `<div class="heading"><div><div class="eyebrow">RELAY / ${pages[active]}</div><h1>${title}</h1><p class="muted">${sub}</p></div>${action}</div>`}
function field(label,key,value,hint='',scope=''){return `<div class="field"><label for="${key}">${label}<small>${hint}</small></label><input id="${key}" value="${esc(value)}" onchange="edit('${key}',this.value,'${scope}')"></div>`}
function edit(k,v,s){if(s)draft.services[s][k]=v;else draft[k]=v;updateBar()}
function updateBar(){document.getElementById('draftLabel').textContent=dirty()?'有待应用修改 · 尚未影响运行配置':'没有待应用修改';document.getElementById('reviewTop').disabled=!dirty()}
function go(n){active=n;render();window.scrollTo(0,0)}
function render(){document.getElementById('nav').innerHTML=pages.map((p,i)=>`<button class="${active===i?'active':''}" ${active===i?'aria-current="page"':''} onclick="go(${i})"><span class="num">0${i+1}</span>${p}</button>`).join('');document.getElementById('main').innerHTML=[overview,wizard,services,delivery,security,diagnostics,config][active]();updateBar()}
function overview(){return header('让配置关系，一眼清楚','从接入服务到视频出口，在一个工作台里检查。以下状态均为演示，不代表设备实时状态。',`<button class="primary" onclick="go(1)">开始部署向导</button>`)+`<div class="grid"><div class="card"><small>当前配置角色</small><div class="metric">${draft.role==='media'?'机房媒体服务':'NAS 主代理'}</div><span>分机直出 / 统一程序</span></div><div class="card"><small>已启用服务</small><div class="metric">${Object.values(draft.services).filter(s=>s.enabled).length} 个</div><span>独立服务标识与密钥</span></div><div class="card"><small>运行验证</small><div class="metric">尚未连接</div><span>真实检查将在后端接入后提供</span></div></div><section class="card" style="margin-top:24px"><h2>视频从哪里出去？</h2><p class="muted">预期链路，不是实时流量监测。普通文件与转码仍可能经过原服务器。</p><div class="flow"><div class="node">客户端<small>登录 / 获取播放地址</small></div><b>→</b><div class="node">主代理<small>原服务器授权，签发票据</small></div><b>→</b><div class="node">机房媒体服务<small>校验票据，传输视频</small></div><b>→</b><div class="node">源站<small>机房内网读取</small></div></div><button onclick="go(3)">查看直出与路径配置</button></section><div class="two"><section class="card"><h2>接入的媒体服务</h2>${Object.entries(draft.services).map(([k,s])=>`<div class="row"><div><strong>${types[k]}</strong><br><small>${s.enabled?'已启用配置 · 连通性未验证':'未启用'}</small></div><button onclick="tab='${k}';go(2)">配置</button></div>`).join('')}</section><section class="card"><h2>上线前还需要</h2><div class="row">01　核对 STRM 容器路径</div><div class="row">02　两端放入相同服务密钥</div><div class="row">03　部署证书并配置路由器端口</div><div class="row">04　客户端起播与拖动验证</div><button onclick="go(5)">打开检查清单</button></section></div>`}
function wizard(){const labels=['部署角色','接入服务','网络与路径','检查与交付'];let body='';if(step===0)body=`<h2>这份配置运行在哪里？</h2><p class="muted">分机部署会生成主代理与媒体端两份配置；不是一个容器跨两台机器运行。</p>${[['proxy','NAS 主代理','连接媒体服务器、读取 STRM、签发播放地址。'],['media','机房媒体服务','接收已授权票据，访问源站并传输视频。不挂载 STRM。']].map(([k,n,d])=>`<button class="choice" aria-pressed="${draft.role===k}" onclick="draft.role='${k}';render()"><strong>${n}</strong><small>${d}</small></button>`).join('')}<div class="banner">单机部署：将两个角色放在同一主机，仍使用两个统一容器。历史单服务 role: all 属于另一种配置格式，本向导暂不转换。</div>`;if(step===1)body=`<h2>选择需要接入的服务</h2>${Object.entries(draft.services).map(([k,s])=>`<div class="row"><label class="check"><input type="checkbox" ${s.enabled?'checked':''} onchange="draft.services.${k}.enabled=this.checked;updateBar()">${types[k]}</label><span class="muted">服务标识：${k}</span></div>`).join('')}<p class="muted">每个服务拥有独立密钥；两端的服务标识与类型必须一致。地址可在“媒体服务”中调整。</p>`;if(step===2)body=deliveryFields();if(step===3)body=`<h2>先检查，再部署</h2><div class="banner">这里只检查示例字段，不探测网络、文件、密钥或证书。导出的 YAML 是原型草案，不能直接用于生产。</div><div class="row">配置角色 <strong>${draft.role}</strong></div><div class="row">媒体公网入口 <strong>${esc(draft.media)}</strong></div><div class="row">服务数量 <strong>${Object.values(draft.services).filter(s=>s.enabled).length}</strong></div><p>下一步：准备各自的 Compose 挂载、共享密钥和已有证书，再进行真实网络检查。</p><div class="actions"><button onclick="exportYaml('proxy')">导出主代理草案</button><button onclick="exportYaml('media')">导出媒体端草案</button></div>`;return header('部署向导','先完成必要配置，高级参数留到部署后按需调整。')+`<div class="steps">${labels.map((l,i)=>`<span class="${step===i?'on':''}">${i+1} / ${l}</span>`).join('')}</div><section class="card">${body}<div id="validation" role="alert"></div><div class="footbar"><button ${step===0?'disabled':''} onclick="step--;render()">上一步</button><button class="primary" onclick="nextStep()">${step===3?'查看待应用变更':'下一步'}</button></div></section>`}
function errors(){let e=[];try{if(new URL(draft.media).protocol!=='https:')e.push('媒体公网入口必须使用 HTTPS。')}catch{e.push('请填写有效的媒体公网 URL。')}if(!Object.values(draft.services).some(s=>s.enabled))e.push('至少启用一个服务。');const enabled=Object.values(draft.services).filter(s=>s.enabled);if(new Set(enabled.map(s=>s.port)).size!==enabled.length)e.push('独立监听端口不能重复。');for(const s of enabled){try{if(!['http:','https:'].includes(new URL(s.target).protocol))throw 0}catch{e.push('服务地址必须是 HTTP 或 HTTPS URL。')}if(!/^\d+$/.test(s.port)||+s.port<1||+s.port>65535)e.push('监听端口应在 1–65535 之间。');if(!/^[a-z0-9.-]+$/i.test(s.host))e.push('服务域名只填写主机名，不含协议或路径。')}if(new Set(enabled.map(s=>s.host.toLowerCase())).size!==enabled.length)e.push('不同服务不能使用相同域名。');if(!draft.root.startsWith('/'))e.push('STRM 容器路径必须为绝对路径。');return [...new Set(e)]}
function nextStep(){if(step<3){const e=step>0?errors():[];if(e.length){document.getElementById('validation').innerHTML=`<div class="error">${e.map(esc).join('<br>')}</div>`;return}step++;render()}else review()}
function services(){const s=draft.services[tab];return header('媒体服务','一个服务一组连接参数。域名共享入口与 IP 独立端口可以同时保留。')+`<div class="tabs">${Object.keys(types).map(k=>`<button class="${tab===k?'selected':''}" onclick="tab='${k}';render()">${types[k]}</button>`).join('')}</div><section class="card"><div class="row"><h2>${types[tab]}</h2><label class="check"><input type="checkbox" ${s.enabled?'checked':''} onchange="draft.services.${tab}.enabled=this.checked;updateBar()">启用服务</label></div>${draft.role==='media'?'<div class="banner">媒体端不连接登录服务器，不配置 STRM 挂载。这里只保留服务标识；源站与密钥见对应模块。</div>':`<div class="two" style="margin-top:24px">${field('原服务器地址','target',s.target,'容器能访问的 HTTP / HTTPS 地址。',tab)}${field('客户端入口域名','host',s.host,'不含协议和路径，用于共享端口分流。',tab)}${field('IP 直连监听端口','port',s.port,'不能与其他服务或现有容器冲突。',tab)}<div><h3>不要混淆两类地址</h3><p class="muted">原服务器地址用于代理回源；客户端使用入口域名或独立端口登录。媒体公网地址不是登录入口。</p></div></div>`}<div class="footbar"><span class="muted">修改仅保留在当前页面内存中</span><button class="primary" onclick="review()">检查变更</button></div></section>`}
function deliveryFields(){return field('媒体公网入口','media',draft.media,'客户端必须能访问，包含 HTTPS 和实际端口。')+pathFields()+field('允许读取视频的服务器','upstream',draft.upstream,'填写 STRM 链接中的主机与端口，不是飞牛 / Emby / Jellyfin 的登录地址。')+`<div class="banner"><strong>怎样填写？</strong><p>例如 STRM 链接是 <code>http://192.0.2.20:19798/dav/电影/某部电影.mkv</code>，这里只填 <code>192.0.2.20:19798</code>。</p><p>不填 http://、影片路径或账号密码。这份白名单限制代理能去哪里读取视频，不是限制哪些观众可以播放。原型暂时只支持填写一台服务器。</p></div>`}
function delivery(){return header('播放与直出','当前统一程序固定使用媒体直出，保留原服务器的授权与转码职责。')+`<div class="banner"><strong>分机直出</strong> · 视频从机房媒体服务传出。302 和同源中继属于历史单服务程序，本页面不直接切换。</div><section class="card">${deliveryFields()}<details><summary>STRM 路径如何对应？</summary><div class="tablewrap"><table><tr><th>所在位置</th><th>示例路径</th></tr><tr><td>NAS 宿主机</td><td>/data/strm</td></tr><tr><td>Emby / Jellyfin 容器看到的路径</td><td>/mnt/strm</td></tr><tr><td>主代理容器应挂载到</td><td>/mnt/strm（只读）</td></tr></table></div><p>对应 Compose：/data/strm:/mnt/strm:ro。媒体端无需挂载该目录。UI 不能替你增加 Docker 挂载。</p></details><div class="footbar"><span class="muted">普通文件、转码与字幕不保证媒体直出</span><button class="primary" onclick="review()">检查变更</button></div></section>`}
function security(){return header('安全与证书','只显示路径与状态，不显示密钥或证书私钥内容。')+`<div class="banner">原型没有登录保护，请勿粘贴真实密钥、密码或生产配置。本机独立管理入口与管理员初始化属于后续实现。</div><section class="card"><h2>每个服务，独立共享密钥</h2>${Object.entries(draft.services).filter(([,s])=>s.enabled).map(([k])=>`<div class="row"><div><strong>${types[k]}</strong><br><small>/run/secrets/${k}.key</small></div><span class="pill">未读取 · 两端内容须一致</span></div>`).join('')}<p class="muted">真实版本将支持安全生成和导出配置包；原型不生成可用于生产的密钥。</p></section><section class="card"><h2>视频 HTTPS 连接证书</h2><p class="muted">用于客户端安全连接视频服务，不是签发播放地址的密钥。由媒体服务提供 HTTPS 时，才填写下面的证书路径。</p><details style="margin-bottom:24px"><summary>反代、端口映射、IPv6 直连，证书分别放在哪里？</summary><div style="margin-top:16px"><h3>通过 HTTPS 反向代理</h3><p>客户端连接反代，证书放在反代上。反代到媒体服务若走可信内网 HTTP，媒体服务无需加载证书；若仍走 HTTPS，媒体服务也需要证书。选择 HTTP 是单独的配置，不是清空证书路径。</p><h3>路由器端口映射</h3><p>路由器只转发连接，不提供 HTTPS。客户端直接连接媒体服务，因此证书和私钥放在媒体服务上。</p><h3>IPv6 直接访问</h3><p>没有反代时，同样由媒体服务提供 HTTPS。可以让域名解析到服务器的 IPv6，客户端仍使用域名访问。</p><h3>域名、IP 和端口怎么对应？</h3><p>例如 https://media.example.com:49967，证书需要匹配 media.example.com，与端口无关。若直接使用 IP，证书必须包含该 IP 且被客户端信任；域名证书不能直接用于 IP 地址。自签名证书通常需要额外配置客户端信任。</p><p>本程序不自动签发、续期或同步证书。请提供已有证书，并把所在目录挂载到负责 HTTPS 的容器中。</p></div></details><div class="two">${field('证书文件路径（完整证书链）','cert',draft.cert)}${field('私钥文件路径','key',draft.key)}</div><p>有效期：未读取。有效内容替换支持热加载；路径变化需要重新应用配置。没有自动签发、续期或同步。</p><button class="primary" onclick="review()">检查变更</button></section>`}
function diagnostics(){return header('按链路定位问题','配置校验、网络可达与真实播放是不同层次，不能用一个“正常”代替。',`<button class="primary" onclick="checks=true;render()">演示检查结果</button>`)+`<section class="card"><h2>${checks?'示例诊断结果（非实时）':'检查项目'}</h2>${[['配置格式',checks?'示例：基础字段通过':'未运行'],['原服务器连接',checks?'示例：可达，仍需当前用户授权':'未运行'],['STRM 文件路径',checks?'示例：缺少只读挂载':'未运行'],['媒体公网入口 / 证书','未运行 · 需真实外网检查'],['实际起播 / 拖动','待客户端验证']].map(([a,b])=>`<div class="row"><strong>${a}</strong><span>${b}</span></div>`).join('')}</section>${checks?'<div class="banner"><strong>示例问题：主代理无法读取 STRM</strong><p>检查媒体服务器返回路径是否与代理容器挂载路径一致。调整 Compose 后需要重建容器，单改白名单不会创建挂载。</p><button onclick="go(3)">查看路径对应</button></div>':''}<section class="card"><h2>脱敏日志示例</h2><pre>[示例] 配置：基础字段校验通过\n[示例] STRM：允许根目录 /mnt/strm，文件不可读取\n[示例] 播放票据：[已隐藏]\n[示例] 源站凭据：[已隐藏]</pre><p class="muted">转码失败需查看原媒体服务器日志，不能通过放宽源站白名单解决。</p></section>`}
function config(){return header('配置管理','导入、预览和应用分开进行；任何变更都应能够追踪与回退。')+`<section class="card"><h2>导入已有配置 · 流程演示</h2><p class="muted">本原型不解析任意 YAML，也不接受生产秘密。加载内置样例，体验导入后的检查与变更流程。</p><div class="actions"><button onclick="loadExample()">加载内置 YAML 样例</button><button onclick="exportYaml(draft.role)">导出当前角色草案</button></div><pre id="importPreview">${importText?esc(importText):'尚未加载样例'}</pre><button class="primary" ${!importText?'disabled':''} onclick="importExample()">导入样例为草稿</button></section><section class="card"><h2>配置版本</h2><div class="row"><div><strong>当前演示配置</strong><br><small>仅当前页面有效，刷新重置</small></div><button onclick="review()" ${!dirty()?'disabled':''}>查看差异</button></div><div class="row"><div><strong>上次应用前快照</strong><br><small>${backup?'可恢复到草稿，不直接应用':'尚未创建'}</small></div><button ${!backup?'disabled':''} onclick="draft=structuredClone(backup);render();notice('快照已恢复到草稿，请检查后再模拟应用')">恢复为草稿</button></div></section>`}
function loadExample(){const example=structuredClone(initial);example.media='https://media-new.example.com:49967';importText=yaml(example,example.role);render()}

function yaml(c,role){const q=JSON.stringify;return '# 原型草案：需补齐密钥、挂载并经真实程序校验，勿直接部署\nrole: '+role+'\nlisten: "0.0.0.0:'+(role==='media'?'49967':'28008')+'"\nallow_http: '+(role==='proxy')+'\nmedia_public_base_url: '+q(c.media)+'\n'+(role==='media'?'tls_cert_file: '+q(c.cert)+'\ntls_key_file: '+q(c.key)+'\n':'')+'services:\n'+Object.entries(c.services).filter(([,s])=>s.enabled).map(([k,s])=>'  '+k+':\n    type: '+k+'\n'+(role==='proxy'?'    target: '+q(s.target)+'\n    hosts: ['+q(s.host)+']\n    direct_listen: "0.0.0.0:'+s.port+'"\n    allowed_strm_roots: ['+q(c.root)+']\n':'')+'    token_key_file: /run/secrets/'+k+'.key\n    token_ttl_seconds: 3600\n    allowed_upstreams: ['+q(c.upstream)+']\n    allowed_origins: ['+q('https://'+s.host)+']\n').join('')}
function exportYaml(role){if(errors().length){notice('请先修正基础字段：'+errors()[0]);return}const url=URL.createObjectURL(new Blob([yaml(draft,role)],{type:'text/yaml;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='relay-'+role+'-prototype.yaml';a.click();URL.revokeObjectURL(url);notice('已导出原型草案，不含密钥，不是生产部署包')}
function flatten(o,p=''){return Object.entries(o).flatMap(([k,v])=>v&&typeof v==='object'?flatten(v,p+k+'.'):[[p+k,String(v)]])}
function review(){const dialog=document.getElementById('dialog'),e=errors(),old=Object.fromEntries(flatten(applied)),diff=flatten(draft).filter(([k,v])=>old[k]!==v);dialog.innerHTML=`<h2>检查并应用变更</h2><p>仅模拟流程，不会写文件、重启容器或访问服务器。</p>${e.length?`<div class="error">${e.map(esc).join('<br>')}</div>`:''}${diff.length?`<div class="tablewrap"><table><tr><th>字段</th><th>当前值</th><th>草稿值</th></tr>${diff.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(old[k])}</td><td>${esc(v)}</td></tr>`).join('')}</table></div><div class="banner" style="margin-top:24px">真实应用可能需要重启主代理或媒体服务，短暂中断播放。原型会先保存一份内存快照。</div>`:'<p>没有待应用变更。可先修改服务地址，或导入内置样例。</p>'}<div class="actions"><button class="primary" ${e.length||!diff.length?'disabled':''} onclick="applyDemo()">模拟应用</button><button onclick="document.getElementById('dialog').close()">返回编辑</button></div>`;dialog.showModal()}
function applyDemo(){backup=structuredClone(applied);applied=structuredClone(draft);document.getElementById('dialog').close();render();notice('模拟应用完成，快照已保存。实际服务未发生变化。')}
function pathFields(){
 if(draft.role==='media')return '<div class="banner"><strong>机房媒体服务不需要 STRM 目录</strong><p>媒体端使用主代理签发的地址读取视频，无需同步 STRM，也无需与 NAS 使用相同路径。文件副本与路径对应只发生在媒体服务器和主代理之间。</p></div>';
 const s=draft.services[tab],rules=s.pathRules||[];
 return `<section class="card"><h2>两边的 STRM 目录</h2><div class="tabs">${Object.keys(types).map(k=>`<button type="button" class="${tab===k?'selected':''}" onclick="tab='${k}';render()">${types[k]}</button>`).join('')}</div><p>如果 ${types[tab]} 和主代理不在同一台机器，请先把 STRM 文件同步或共享给主代理，再填写两边的目录。目录名可以不同，但应包含对应的文件。</p><p><strong>通常只需填写一组目录。</strong><br>电影和剧集都在同一个 STRM 总目录下，只填总目录；如果分别挂载到不同位置，再分别添加。</p>${rules.map((r,i)=>`<h3>目录对应 ${i+1}</h3><div class="two"><div class="field"><label for="from-${i}">${types[tab]} 中的 STRM 目录</label><input id="from-${i}" value="${esc(r.from)}" onchange="draft.services[tab].pathRules[${i}].from=this.value;updateBar()"></div><div class="field"><label for="to-${i}">主代理能读取的对应目录<small>使用 Docker 时，填写主代理容器内的目录。</small></label><input id="to-${i}" value="${esc(r.to)}" onchange="draft.services[tab].pathRules[${i}].to=this.value;updateBar()"></div></div><button type="button" onclick="draft.services[tab].pathRules.splice(${i},1);render()">移除这组目录（${i+1}）</button>`).join('')}<div class="actions" style="margin:16px 0"><button type="button" onclick="if(!draft.services[tab].pathRules)draft.services[tab].pathRules=[];draft.services[tab].pathRules.push({from:'/media/movies',to:'/data/synced-strm'});render()">${rules.length?'再添加一组目录对应':'添加第一组目录对应'}</button></div><p class="muted">只有不同目录需要分别对应时才添加；同一目录下的子文件夹自动沿用，无需逐个填写。</p><details><summary>用一个 STRM 文件试试看</summary><label for="samplePath">${types[tab]} 中的 STRM 文件路径</label><input id="samplePath" value="/media/movies/某部电影.strm"><button type="button" style="margin-top:16px" onclick="previewPath()">看看主代理会读取哪里</button><div id="pathResult" role="status" style="margin-top:16px">仅预览路径，不检查真实文件。</div></details><details style="margin-top:16px"><summary>同步和 Docker 挂载需要我做什么？</summary><p>例如文件同步到主代理机器的 /srv/sync，再通过 /srv/sync:/data/synced-strm:ro 挂载进容器。右侧填写 /data/synced-strm。这里不会自动同步文件或创建挂载。</p></details><p class="muted" style="margin-top:24px">原型演示：目录对应尚未接入程序，暂不能导出含此功能的主代理配置。机房媒体服务不需要这些目录。</p></section>`;
}
function previewPath(){const p=document.getElementById('samplePath').value;const rules=draft.services[tab].pathRules||[];const clean=x=>x.replace(/\/+$/,'')||'/';const safe=x=>x.startsWith('/')&&!x.includes('\\')&&!x.split('/').some(v=>v==='.'||v==='..');let msg='';if(!safe(p)||rules.some(r=>!safe(r.from)||!safe(r.to)))msg='路径无效：使用绝对路径，不允许 .、.. 或反斜线。';else {const matches=rules.filter(r=>p===clean(r.from)||p.startsWith(clean(r.from)==='/'?'/':clean(r.from)+'/')).sort((a,b)=>clean(b.from).length-clean(a.from).length);if(!matches.length)msg='没有匹配规则：请核对媒体服务器返回的路径，不会猜测其他目录。';else if(matches.length>1&&clean(matches[0].from)===clean(matches[1].from))msg='规则冲突：相同来源前缀存在多条对应，请先移除重复规则。';else {const r=matches[0],suffix=p.slice(clean(r.from)==='/'?0:clean(r.from).length);msg='转换结果：'+clean(r.to).replace(/\/$/,'')+suffix+'（未检查文件存在或读取权限）';}}document.getElementById('pathResult').textContent=msg;}

exportYaml=function(role){if(role==='proxy'&&Object.values(draft.services).some(s=>s.enabled&&((s.pathRules||[]).length||s.readMode==='url'))){notice('暂不能导出：新的读取方式及路径映射尚未接入程序。可查看变更并模拟应用。');return}legacyExport(role)};

function managedDialog(kind,method='upload',service=''){

 d.innerHTML=`<h2>${title}</h2><div class="banner">仅演示网页操作流程。当前没有登录保护和安全保存后端，文件选择与实际粘贴暂不开放，请勿输入真实秘密。</div><div class="tabs"><button onclick="managedDialog('${kind}','upload','${service}')" class="${method==='upload'?'selected':''}">上传文件</button><button onclick="managedDialog('${kind}','paste','${service}')" class="${method==='paste'?'selected':''}">粘贴内容</button></div>${method==='upload'?`<label for="demoFile">${kind==='certificate'?'证书链文件及私钥文件':'选择文件'}</label><input id="demoFile" type="file" disabled><p class="muted">正式版将在网页内接收文件，自动保存到程序管理目录，无需 SSH。</p>`:`<label for="demoPaste">${kind==='certificate'?'证书链与私钥将分别粘贴':'粘贴内容'}</label><textarea id="demoPaste" disabled placeholder="安全后端接入后开放；原型请使用下方内置样例"></textarea>`}<p>${kind==='certificate'?'提交后应检查格式、证书与私钥是否匹配、域名和有效期；失败时保留原证书。':kind==='key'?'导入后不回显密钥；两端同一服务必须使用相同密钥。':kind==='bundle'?'先核对来源、目标角色及服务标识，再确认导入；不会自动覆盖现有密钥。':'正式版应识别配置格式、保留未知项并提示不兼容，不静默丢弃参数。'}</p><div class="actions"><button class="primary" onclick="stageManaged('${kind}','${service}')">使用内置样例演示</button><button onclick="document.getElementById('dialog').close()">取消</button></div>`;if(!d.open)d.showModal();
 if(kind==='certificate'){
  const input=d.querySelector(method==='upload'?'#demoFile':'#demoPaste');
  const label=d.querySelector('label');
  label.textContent=method==='upload'?'证书链文件（PEM）':'证书链内容（PEM）';
  const extra=document.createElement('div');extra.className='field';extra.style.marginTop='16px';
  extra.innerHTML=method==='upload'?'<label for="demoPrivateKey">私钥文件（PEM）</label><input id="demoPrivateKey" type="file" disabled>':'<label for="demoPrivateKey">私钥内容（PEM）</label><textarea id="demoPrivateKey" disabled placeholder="真实私钥粘贴将在安全后端接入后开放"></textarea>';
  input.after(extra);
 }
}

// One environment boundary. Production copy never claims an unimplemented operation succeeded.
const backendConnected=false;
function productionCopy(root){
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
 for(const node of nodes){let t=node.nodeValue;
  if(/原型|演示|内置样例|示例|尚未接入|尚未实现|规划能力/.test(t)&&t.trim().length>35){
   if(/仅配置文件/.test(t))t='配置文件不包含密钥、证书及私钥。完整备份应加密保存，请勿上传到公共仓库。';
   else if(/独立共享密钥|安全存储|管理员登录|登录保护/.test(t))t='';
   else if(/导出|保存一份/.test(t))t='导出本端配置文件，不包含密钥和证书。';
   else if(/目录对应|路径映射/.test(t))t='目录对应按服务分别设置，媒体服务无需挂载 STRM。';
   else if(/日志/.test(t))t='暂无日志，请先连接管理服务。';
   else t='';
  }
  t=t.replace(/原型演示/g,'开发环境').replace(/交互原型 \/ 功能评审版/g,'配置工作台').replace(/仅示例数据 · 不连接生产/g,'').replace(/刷新页面会重置所有演示状态/g,'').replace(/原型未接入登录或持久化存储/g,'管理服务未连接').replace(/模拟应用/g,'应用配置').replace(/配置草案/g,'配置').replace(/演示配置/g,'配置').replace(/当前演示配置/g,'当前配置').replace(/演示生成/g,'生成密钥').replace(/（演示）/g,'').replace(/示例诊断结果（非实时）/g,'诊断结果').replace(/演示检查结果/g,'开始检查').replace(/脱敏日志示例/g,'日志').replace(/两端交接包 · 设计预览/g,'两端交接包').replace(/规划能力/g,'目录对应').replace(/原型状态/g,'未验证').replace(/正式版：/g,'').replace(/正式版将/g,'系统将').replace(/正式版会/g,'系统会').replace(/正式版需/g,'需要').replace(/正式版/g,'').replace(/真实版本将/g,'系统将').replace(/真实后端/g,'管理服务');
  if(/原型|内置样例|示例|演示/.test(t)&&!node.parentElement.closest('button')){
   t=/保存一份到本地/.test(t)?'保存到本地，不包含密钥和证书。':/日志/.test(t)?'暂无日志。':'';
  }
  node.nodeValue=t;
 }
 for(const el of root.querySelectorAll('button')){
  const action=el.getAttribute('onclick')||'';
  if(!backendConnected&&/managedDialog|exportYaml|handoffPreview|generateDemoKey|stageManaged|applyDemo|checks=true|draft=structuredClone\(backup\)|loadExample|importExample/.test(action)){
   el.disabled=true;el.title='暂不可用：管理服务未连接';el.setAttribute('aria-description','暂不可用：管理服务未连接');
  }
 }
 for(const p of root.querySelectorAll('p,.banner'))if(!p.textContent.trim()&&!p.querySelector('input,button,details'))p.remove();
}
