services:
  proxy:
    # 固定正式版本，提供 amd64 / arm64；不监听专用媒体端口
    image: ghcr.io/qiwolf/fntv-proxy-relay:0.9.8-relay.3
    # 本地构建：取消下两行注释，并将 image 改为 fntv-proxy-relay:direct-local
    # build:
    #   context: ../..
    restart: unless-stopped
    ports:
      - "28005:28005"
    environment:
      CONFIG: /app/config.yaml
    volumes:
      - ./proxy.config.yaml:/app/config.yaml:ro
      # 飞牛上报的 STRM 绝对路径必须与容器内路径一致
      # 左侧是代理宿主机的实际目录，右侧是飞牛看到的目录，左右不必相同。
      # 同时启用 Emby/Jellyfin 时按各自库内路径追加映射，详见 docs/STRM_MOUNTS.md。
      - /media/strm:/media/strm:ro
      # 宿主机文件必须为 0600，只读绑定保留 Linux 文件权限
      - ./secrets/media_key:/run/secrets/media_key:ro
