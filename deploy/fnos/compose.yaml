name: fntv-proxy-relay

services:
  fntv-proxy-relay:
    image: ghcr.io/qiwolf/fntv-proxy-relay:0.9.8-relay.2
    # 可选：用预先交叉编译的 fntv-proxy-relay 文件构建运行镜像。
    # 启用前将 image 改成本地标签。
    # build:
    #   context: .
    #   dockerfile: Dockerfile.runtime
    container_name: fntv-proxy-relay
    network_mode: host
    restart: unless-stopped
    environment:
      CONFIG: /app/config.yaml
      TZ: Asia/Shanghai
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./logs:/app/logs
      - /vol00/strm:/vol00/strm:ro
