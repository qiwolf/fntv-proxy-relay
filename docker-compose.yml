services:
  fntv-proxy-relay:
    image: ghcr.io/qiwolf/fntv-proxy-relay:latest
    container_name: fntv-proxy-relay
    network_mode: host
    volumes:
      # 挂载strm文件目录（根据实际路径修改）
      - /vol00/strm:/vol00/strm:ro
      # 挂载配置文件（可选，用于热重载）
      - ./config.yaml:/app/config.yaml:ro
      # 可选：挂载日志目录（debug模式）
      # - ./logs:/app/logs
    environment:
      # 配置文件路径
      - CONFIG=/app/config.yaml
    restart: unless-stopped
    # 若不使用 host 网络，请删除 network_mode 并映射 28005/8095 端口。
